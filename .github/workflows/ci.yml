name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py scan
      - run: python manage.py test --require-js
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [xiao_jury_demo, xiao_esp32c3, xiao_sim7600_bench]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py build --environment ${{ matrix.environment }}
