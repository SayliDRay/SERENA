[platformio]
default_envs = xiao_jury_demo

[env:xiao_esp32c3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit MPU6050@2.2.6
  adafruit/Adafruit Unified Sensor@1.1.15
  adafruit/Adafruit BusIO@1.17.4
build_flags = -std=gnu++11

; Experimental physical bench profile. Never load this with the Wokwi diagram.
; Family number and operator qualification default to empty/false.
[env:xiao_sim7600_bench]
extends = env:xiao_esp32c3
build_flags = ${env:xiao_esp32c3.build_flags} -DNORA_REAL_MODEM=1

; Presentation profile: real call through a local serial bridge, no SIM/modem emulation.
[env:xiao_jury_demo]
extends = env:xiao_esp32c3
build_flags = ${env:xiao_esp32c3.build_flags} -DNORA_JURY_DEMO=1
